method:
  maximum_adaptive_themes: 8
  masked_interest_probability: 0.50
  target_anchor: nearest_theme
  masked_anchor: uniform_non_target_theme
  frozen_image_encoder: true
  frozen_diffusion_backbone: true
  trainable_components:
    sd15_sdxl:
      - preference_adapter
      - preference_attention_projections
      - layerwise_gates
    pixart:
      - user_caption_prefix_projection
      - theme_caption_prefix_projection
      - scalar_gates

optimization:
  optimizer: AdamW
  learning_rate: 5.0e-4
  contrastive_temperature: 0.07
  contrastive_loss_weight: 0.05
  residual_regularizer_weight: 1.0e-7

generation:
  images_per_user: 10
  denoising_steps: 20-30
  anchor_allocation: support_proportional
  backbones:
    - Stable-Diffusion-v1.5
    - Stable-Diffusion-XL-Base-1.0
    - PixArt-XL-2-512x512

source_attribution:
  primary_judge: Qwen3-VL-32B-Instruct
  robustness_judges: [Qwen3.5-27B, Qwen3.8-27B]
  labels: [Direct History, CF Extrapolation, Other]
  stages: [history, collaborative_filtering]
  nearest_users: 5
  recalled_history_images: 5
  recalled_cf_images: 5

ranking:
  hitrate: [10, 20, 50]
  recall: [20, 100]
  ndcg: [20, 100]

human_validation:
  volunteers: 40
  users_per_dataset_approach_group: 100
  images_per_user: 10

cold_start:
  users: 100
  source_pool_users: 1000
  initial_images_per_user: 5-10
  initial_themes_per_user: 1-3
  rounds: 5
  images_per_round: 10
  maximum_to_minimum_theme_ratio: 3
